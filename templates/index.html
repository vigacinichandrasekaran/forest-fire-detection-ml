<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Forest Fire Detection</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
<div class="container">

    <h1>🌲 Forest Fire Detection System</h1>
    <p class="subtitle">
        Comparative Analysis using Machine Learning (SVM) and Deep Learning (CNN)
    </p>

    <!-- Upload Form -->
    <form method="POST" enctype="multipart/form-data">

        <!-- Model Selection -->
        <div class="model-select">
            <label for="model_type">Select Detection Model</label>
            <select name="model_type" id="model_type" required>
                <option value="" disabled selected>Choose a model</option>
                <option value="svm">SVM (HOG + Classical ML)</option>
                <option value="cnn">CNN (Deep Learning)</option>
            </select>
        </div>

        <!-- Image Upload -->
        <label class="upload-box">
            <input type="file" name="image" accept="image/*" required onchange="previewImage(event)">
            <span>📷 Upload Forest Image</span>
        </label>

        <!-- Image Preview -->
        <img id="preview" class="preview-img"/>

        <button type="submit">Analyze Image</button>
    </form>

    {% if result %}
    <!-- Result Section -->
    <div class="result-card {{ 'fire' if result=='Fire Detected' else 'safe' }}">
        <h2>{{ result }}</h2>
        <p class="model-used">
            Model Used:
            <strong>{{ 'CNN (Deep Learning)' if selected_model=='cnn' else 'SVM (Machine Learning)' }}</strong>
        </p>

        <!-- Confidence -->
        <div class="confidence">
            <span>Confidence: {{ confidence }}%</span>
            <div class="bar">
                <div class="fill" style="width: {{ confidence }}%"></div>
            </div>
        </div>

        <!-- Safety Message -->
        <p class="safety">{{ safety_msg }}</p>
    </div>
    {% endif %}

</div>

<script>
function previewImage(event) {
    const img = document.getElementById("preview");
    img.src = URL.createObjectURL(event.target.files[0]);
    img.style.display = "block";
}
</script>


</body>
</html>
